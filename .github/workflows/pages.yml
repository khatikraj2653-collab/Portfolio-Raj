name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static build
        run: |
          mkdir -p _site
          # Copy every static asset but skip server-only files that
          # would otherwise bloat or break the GitHub Pages build.
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='functions' \
            --exclude='node_modules' \
            --exclude='wrangler.toml' \
            --exclude='pnpm-*.yaml' \
            --exclude='package.json' \
            --exclude='.claude' \
            --exclude='admin.html' \
            ./ _site/
          # Ship a .nojekyll so GitHub Pages serves every file as-is
          # (don't let Jekyll strip underscore-prefixed assets).
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
