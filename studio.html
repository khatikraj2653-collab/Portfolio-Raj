<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Raj — AI Studio</title>
<style>
  :root {
    --bg: #0A0D14;
    --card: #141922;
    --card-2: #1A212D;
    --border: #232B3A;
    --border-strong: #2F3A4E;
    --ink: #F0F4FB;
    --muted: #8491A8;
    --faint: #5B6477;
    --indigo: #5B9BFF;
    --indigo-soft: rgba(91,155,255,.14);
    --green: #34D399;
    --green-soft: rgba(52,211,153,.14);
    --amber: #F5A524;
    --amber-soft: rgba(245,165,36,.14);
    --red: #F87171;
    --red-soft: rgba(248,113,113,.14);
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    --sans: 'Inter', -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--indigo); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font-family: var(--sans); cursor: pointer; }

  .page { max-width: 1280px; margin: 0 auto; padding: 24px 24px 80px; }

  header.studio-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  header.studio-head h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  header.studio-head h1 em { color: var(--indigo); font-style: normal; }
  header.studio-head .sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .head-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn { background: var(--card); color: var(--ink); border: 1px solid var(--border-strong); border-radius: 6px; padding: 8px 14px; font-size: 12px; font-weight: 600; transition: all .15s; }
  .btn:hover:not(:disabled) { border-color: var(--indigo); background: var(--indigo-soft); }
  .btn.primary { background: var(--indigo); color: #06101F; border-color: var(--indigo); }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--indigo); }
  .btn.danger { color: var(--red); border-color: rgba(248,113,113,.3); }
  .btn.danger:hover:not(:disabled) { background: var(--red-soft); border-color: var(--red); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .auto-refresh { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11.5px; font-family: var(--mono); }
  .auto-refresh input { accent-color: var(--indigo); }

  /* Login */
  #loginBox { max-width: 360px; margin: 120px auto; padding: 32px 28px 24px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; text-align: center; }
  #loginBox h2 { font-size: 16px; margin: 0 0 20px; }
  #loginBox input { width: 100%; padding: 11px 14px; border: 1px solid var(--border); background: var(--bg); color: var(--ink); border-radius: 6px; font-family: var(--mono); font-size: 13px; margin-bottom: 10px; }
  #loginBox input:focus { outline: none; border-color: var(--indigo); }
  #loginBox button { width: 100%; padding: 11px; background: var(--indigo); color: #06101F; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-family: var(--mono); font-size: 13px; }
  #loginError { color: var(--red); font-size: 12px; margin-top: 10px; min-height: 16px; }

  #dashboard { display: none; }

  /* Summary stats */
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .stat .lbl { font-family: var(--mono); font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
  .stat .val { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Action-result banner */
  #actionStatus { display: none; background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--indigo); border-radius: 8px; padding: 10px 16px; margin-bottom: 16px; font-family: var(--mono); font-size: 12px; color: var(--muted); }

  /* Per-site grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 14px; }
  .site-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; border-left: 3px solid var(--faint); cursor: pointer; transition: border-color .15s, transform .1s; }
  .site-card:hover { border-color: var(--indigo); transform: translateY(-1px); }
  .site-card.status-green { border-left-color: var(--green); }
  .site-card.status-yellow { border-left-color: var(--amber); }
  .site-card.status-red { border-left-color: var(--red); }
  .site-card.status-na { border-left-color: var(--indigo); }

  .site-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 10px; }
  .site-head .name { font-size: 15px; font-weight: 700; }
  .site-head .url { font-size: 11px; color: var(--faint); font-family: var(--mono); display: block; margin-top: 2px; word-break: break-all; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 10px; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; white-space: nowrap; }
  .badge.green { background: var(--green-soft); color: var(--green); }
  .badge.yellow { background: var(--amber-soft); color: var(--amber); }
  .badge.red { background: var(--red-soft); color: var(--red); }
  .badge.na { background: var(--indigo-soft); color: var(--indigo); }

  /* Chart blocks */
  .chart-block { margin: 10px 0; }
  .chart-label { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--mono); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px; }
  .chart-label .note { color: var(--faint); text-transform: none; letter-spacing: 0; }

  .uptime-row { display: flex; gap: 3px; }
  .uptime-cell { flex: 1; height: 20px; border-radius: 3px; background: var(--border); position: relative; cursor: default; transition: transform .1s; }
  .uptime-cell.up { background: var(--green); }
  .uptime-cell.down { background: var(--red); }
  .uptime-cell:hover { transform: scaleY(1.2); }
  .uptime-cell .tip { display: none; position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--card-2); border: 1px solid var(--border-strong); border-radius: 5px; padding: 5px 9px; font-family: var(--mono); font-size: 10.5px; white-space: nowrap; z-index: 10; }
  .uptime-cell:hover .tip { display: block; }

  .spark-row { display: flex; gap: 2px; align-items: flex-end; height: 36px; }
  .spark-cell { flex: 1; min-height: 2px; background: var(--border); border-radius: 2px 2px 0 0; position: relative; transition: transform .1s; }
  .spark-cell.err { background: var(--amber); }
  .spark-cell.err.hi { background: var(--red); }
  .spark-cell:hover { transform: scaleY(1.05) scaleX(1.5); z-index: 5; }
  .spark-cell .tip { display: none; position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: var(--card-2); border: 1px solid var(--border-strong); border-radius: 5px; padding: 5px 9px; font-family: var(--mono); font-size: 10.5px; white-space: nowrap; z-index: 10; }
  .spark-cell:hover .tip { display: block; }

  /* Site-card metrics row */
  .mini-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 12px 0 0; padding: 10px 0 0; border-top: 1px solid var(--border); }
  .mini-metrics .m { }
  .mini-metrics .mv { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .mini-metrics .ml { font-family: var(--mono); font-size: 9.5px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }

  .site-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 11.5px; color: var(--muted); }
  .site-foot .open-arrow { color: var(--indigo); font-weight: 600; }

  /* Detail view */
  #detailScreen { display: none; }
  .detail-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 12px; }
  .detail-head-left { display: flex; align-items: center; gap: 12px; }
  .detail-head h2 { font-size: 20px; font-weight: 700; margin: 0; }
  .detail-head .url { color: var(--faint); font-family: var(--mono); font-size: 12px; }

  .detail-section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; }
  .detail-section h3 { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
  .filter-input { background: var(--bg); border: 1px solid var(--border); color: var(--ink); font-family: var(--mono); font-size: 11px; padding: 4px 8px; border-radius: 4px; width: 160px; text-transform: none; letter-spacing: 0; }
  .filter-input:focus { outline: none; border-color: var(--indigo); }

  .scroll-list { max-height: 360px; overflow-y: auto; padding-right: 4px; }
  .scroll-list::-webkit-scrollbar { width: 6px; }
  .scroll-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

  .empty-note { color: var(--muted); font-size: 12px; font-style: italic; padding: 8px 0; }

  table.data { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.data th { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); color: var(--faint); font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; position: sticky; top: 0; background: var(--card); }
  table.data td { padding: 7px 8px; border-bottom: 1px dashed var(--border); color: var(--ink); vertical-align: top; }
  table.data tr:last-child td { border-bottom: none; }
  table.data td.muted { color: var(--muted); }
  table.data td.wrap { max-width: 400px; word-break: break-word; }
  table.data td.q { font-weight: 600; max-width: 240px; word-break: break-word; }
  table.data td.a { color: var(--muted); max-width: 400px; word-break: break-word; font-size: 11.5px; }

  .err-item { padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 11.5px; }
  .err-item:last-child { border-bottom: none; }
  .err-item .src { color: var(--amber); font-family: var(--mono); font-size: 10.5px; font-weight: 600; }
  .err-item .ts { color: var(--faint); font-family: var(--mono); font-size: 10px; margin-left: 8px; }
  .err-item .msg { color: var(--muted); margin-top: 3px; font-size: 11px; line-height: 1.45; word-break: break-word; }

  footer { margin-top: 40px; text-align: center; color: var(--faint); font-size: 11px; font-family: var(--mono); }

  @media (max-width: 720px) {
    .mini-metrics { grid-template-columns: repeat(2, 1fr); }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="loginBox">
  <h2>AI Studio Status</h2>
  <input type="password" id="pwInput" placeholder="Admin password" autofocus>
  <button id="loginBtn">Enter</button>
  <div id="loginError"></div>
</div>

<div id="dashboard" class="page">
  <header class="studio-head">
    <div>
      <h1>Raj's <em>AI Studio</em></h1>
      <div class="sub" id="genAt">Loading…</div>
    </div>
    <div class="head-actions">
      <label class="auto-refresh"><input type="checkbox" id="autoRefresh"> Auto-refresh (60s)</label>
      <button class="btn" id="wakeAllBtn">⚡ Wake all</button>
      <button class="btn danger" id="wipeBtn">🗑 Wipe visits</button>
      <button class="btn primary" id="refreshBtn">↻ Refresh</button>
    </div>
  </header>

  <div id="actionStatus"></div>

  <div id="overviewScreen">
    <div class="summary" id="summary"></div>
    <div class="grid" id="grid"></div>
  </div>

  <div id="detailScreen">
    <div class="detail-head">
      <div class="detail-head-left">
        <button class="btn" id="backBtn">← Back</button>
        <div>
          <h2 id="detailTitle"></h2>
          <span class="url" id="detailUrl"></span>
        </div>
      </div>
      <span class="badge" id="detailStatus"></span>
    </div>
    <div id="detailStatsRow" class="summary"></div>
    <div id="detailBody"></div>
  </div>

  <footer>
    Raj Khatik · AI Studio monitoring dashboard · Private (noindex, nofollow)
  </footer>
</div>

<script>
const loginBox = document.getElementById('loginBox');
const dashboard = document.getElementById('dashboard');
const pwInput = document.getElementById('pwInput');
const loginError = document.getElementById('loginError');
const actionStatus = document.getElementById('actionStatus');
const overviewScreen = document.getElementById('overviewScreen');
const detailScreen = document.getElementById('detailScreen');

let autoRefreshTimer = null;
let lastStatus = null;
let lastLogs = null;

const SITE_LABELS = {
  portfolio: 'Portfolio website',
  semibot: 'SemiBot',
  goldbot: 'GoldBot',
  silverbot: 'SilverBot',
  hallucinationdetector: 'Hallucination Detector',
  retailresearch: 'Retail Research',
};

async function loadAll(pw) {
  loginError.textContent = '';
  let statusRes, logsRes;
  try {
    [statusRes, logsRes] = await Promise.all([
      fetch('/api/studio-status', { headers: { 'X-Admin-Password': pw } }),
      fetch('/api/admin/logs', { headers: { 'X-Admin-Password': pw } }),
    ]);
  } catch (err) { loginError.textContent = 'Network error.'; return; }

  if (statusRes.status === 401 || logsRes.status === 401) { loginError.textContent = 'Wrong password.'; return; }
  if (!statusRes.ok) { loginError.textContent = 'Status error ' + statusRes.status; return; }
  if (!logsRes.ok) { loginError.textContent = 'Logs error ' + logsRes.status; return; }

  lastStatus = await statusRes.json();
  lastLogs = await logsRes.json();
  sessionStorage.setItem('studioPw', pw);
  renderOverview();
  loginBox.style.display = 'none';
  dashboard.style.display = 'block';
}

// --- Helpers ---
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
function fmtTime(iso) { if (!iso) return '—'; return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
function fmtTimeFull(iso) { if (!iso) return '—'; return new Date(iso).toLocaleString(); }
function fmtRelative(iso) {
  if (!iso) return 'never';
  const sec = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
  if (sec < 60) return sec + 's ago';
  if (sec < 3600) return Math.round(sec / 60) + 'm ago';
  if (sec < 86400) return Math.round(sec / 3600) + 'h ago';
  return Math.round(sec / 86400) + 'd ago';
}
function fmtLocation(row) { return [row && row.city, row && row.country].filter(Boolean).join(', ') || 'Unknown'; }
function fmtDevice(ua) {
  if (!ua) return 'Unknown';
  if (/Mobi|Android/i.test(ua)) return 'Mobile';
  if (/iPad|Tablet/i.test(ua)) return 'Tablet';
  return 'Desktop';
}
function unwrap(x) {
  if (Array.isArray(x)) return { items: x, total: x.length, truncated: false };
  if (x && Array.isArray(x.items)) return { items: x.items, total: x.total || 0, truncated: !!x.truncated };
  return { items: [], total: 0, truncated: false };
}
function fmtCount(n, truncated) { return (n || 0).toLocaleString() + (truncated ? '+' : ''); }

// Combine status + logs into a single per-site data map.
function combinedData(key) {
  const statusApp = (lastStatus && lastStatus.apps && lastStatus.apps[key]) || null;
  let visits, searches, chats;
  if (key === 'portfolio') {
    visits = unwrap(lastLogs && lastLogs.visits);
    searches = { items: [], total: 0, truncated: false };
    chats = unwrap(lastLogs && lastLogs.chats);
  } else {
    const a = (lastLogs && lastLogs.apps && lastLogs.apps[key]) || {};
    visits = unwrap(a.visits);
    searches = unwrap(a.searches);
    chats = unwrap(a.chats);
  }
  return {
    status: statusApp,
    label: statusApp ? statusApp.label : (SITE_LABELS[key] || key),
    url: statusApp ? statusApp.url : 'https://portfolio-raj.pages.dev',
    visits, searches, chats,
  };
}

// Reduce probes_14d → 14-day uptime array (one calendar day per cell).
function bucketProbesByDay(probes14d) {
  const now = new Date();
  const days = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(now); d.setDate(d.getDate() - i); d.setHours(0,0,0,0);
    days.push({ day: d, probes: [], state: 'none' });
  }
  for (const p of (probes14d || [])) {
    const t = new Date(p.timestamp);
    const ds = new Date(t); ds.setHours(0,0,0,0);
    const b = days.find(x => x.day.getTime() === ds.getTime());
    if (b) b.probes.push(p);
  }
  for (const b of days) {
    if (!b.probes.length) continue;
    b.state = b.probes.some(p => p.status === 'down') ? 'down' : 'up';
  }
  return days;
}

function renderUptimeBar(probes14d) {
  const days = bucketProbesByDay(probes14d);
  return `<div class="uptime-row">${days.map(d => {
    const label = d.day.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    const tip = d.state === 'none' ? label + ' · no probe' : label + ' · ' + d.state.toUpperCase();
    return `<div class="uptime-cell ${d.state}"><span class="tip">${tip}</span></div>`;
  }).join('')}</div>`;
}

function renderSparkline(hourly) {
  const arr = hourly || new Array(24).fill(0);
  const max = Math.max(1, ...arr);
  return `<div class="spark-row">${arr.map((n, i) => {
    const h = max ? Math.max(2, Math.round((n / max) * 32)) : 2;
    const hoursAgo = 23 - i;
    const hr = hoursAgo === 0 ? 'this hour' : hoursAgo + 'h ago';
    const cls = n === 0 ? '' : (n >= max * 0.7 && n > 2 ? 'err hi' : 'err');
    return `<div class="spark-cell ${cls}" style="height:${h}px"><span class="tip">${n} err · ${hr}</span></div>`;
  }).join('')}</div>`;
}

// --- Overview ---
function renderOverview() {
  overviewScreen.style.display = 'block';
  detailScreen.style.display = 'none';
  document.getElementById('genAt').textContent = 'Last updated: ' + new Date().toLocaleTimeString();

  // Summary stats
  const statusApps = (lastStatus && lastStatus.apps) || {};
  const statusKeys = Object.keys(statusApps);
  const healthy = statusKeys.filter(k => statusApps[k].status === 'green').length;
  const degraded = statusKeys.filter(k => statusApps[k].status === 'yellow').length;
  const down = statusKeys.filter(k => statusApps[k].status === 'red').length;
  const errs24h = statusKeys.reduce((s, k) => s + (statusApps[k].errors_24h || 0), 0);

  // Aggregate visits + chats across portfolio + apps
  let totalVisits = 0, totalChats = 0;
  const allKeys = ['portfolio', ...statusKeys];
  for (const k of allKeys) {
    const d = combinedData(k);
    totalVisits += d.visits.total || 0;
    totalChats += d.chats.total || 0;
  }

  document.getElementById('summary').innerHTML = `
    <div class="stat"><div class="lbl">Apps</div><div class="val">${statusKeys.length}</div></div>
    <div class="stat"><div class="lbl">Healthy</div><div class="val" style="color:var(--green)">${healthy}</div></div>
    <div class="stat"><div class="lbl">Degraded</div><div class="val" style="color:var(--amber)">${degraded}</div></div>
    <div class="stat"><div class="lbl">Down</div><div class="val" style="color:var(--red)">${down}</div></div>
    <div class="stat"><div class="lbl">Visits (all time)</div><div class="val">${totalVisits.toLocaleString()}</div></div>
    <div class="stat"><div class="lbl">Chats (all time)</div><div class="val">${totalChats.toLocaleString()}</div></div>
    <div class="stat"><div class="lbl">Errors / 24h</div><div class="val">${errs24h}</div></div>
  `;

  // Per-site cards
  document.getElementById('grid').innerHTML = allKeys.map(k => renderSiteCard(k)).join('');
  document.querySelectorAll('.site-card').forEach(card => {
    card.addEventListener('click', () => renderDetail(card.dataset.key));
  });
}

function renderSiteCard(key) {
  const d = combinedData(key);
  const isPortfolio = key === 'portfolio';
  const s = d.status;
  const statusCls = isPortfolio ? 'na' : (s ? s.status : 'na');
  const statusLabel = isPortfolio ? 'site' : (s ? s.status : 'unknown');

  const uptimeBlock = isPortfolio ? '' : `
    <div class="chart-block">
      <div class="chart-label"><span>14-day uptime</span><span class="note">one bar/day</span></div>
      ${renderUptimeBar(s && s.probes_14d)}
    </div>
    <div class="chart-block">
      <div class="chart-label"><span>Errors · last 24h</span><span class="note">per hour</span></div>
      ${renderSparkline(s && s.errors_24h_hourly)}
    </div>
  `;

  const metricsBlock = `
    <div class="mini-metrics">
      <div class="m"><div class="mv">${(d.visits.total || 0).toLocaleString()}${d.visits.truncated ? '+' : ''}</div><div class="ml">Visits</div></div>
      <div class="m"><div class="mv">${(d.chats.total || 0).toLocaleString()}${d.chats.truncated ? '+' : ''}</div><div class="ml">Chats</div></div>
      ${isPortfolio
        ? `<div class="m"><div class="mv">—</div><div class="ml">Searches</div></div>
           <div class="m"><div class="mv">—</div><div class="ml">Errors 24h</div></div>`
        : `<div class="m"><div class="mv">${(d.searches.total || 0).toLocaleString()}${d.searches.truncated ? '+' : ''}</div><div class="ml">Searches</div></div>
           <div class="m"><div class="mv">${s ? s.errors_24h : 0}</div><div class="ml">Errors 24h</div></div>`}
    </div>
  `;

  const footText = isPortfolio
    ? 'Click for visitor + chat detail'
    : (s && s.last_probe ? 'Last probe ' + fmtRelative(s.last_probe.timestamp) : 'No probe yet');

  return `
    <div class="site-card status-${statusCls}" data-key="${esc(key)}">
      <div class="site-head">
        <div>
          <div class="name">${esc(d.label)}</div>
          <span class="url">${esc(d.url.replace(/^https?:\/\//, '').replace(/\/$/, ''))}</span>
        </div>
        <span class="badge ${statusCls}">● ${statusLabel}</span>
      </div>
      ${uptimeBlock}
      ${metricsBlock}
      <div class="site-foot"><span>${footText}</span><span class="open-arrow">Details →</span></div>
    </div>
  `;
}

// --- Detail view ---
function renderDetail(key) {
  const d = combinedData(key);
  const isPortfolio = key === 'portfolio';
  const s = d.status;
  overviewScreen.style.display = 'none';
  detailScreen.style.display = 'block';

  document.getElementById('detailTitle').textContent = d.label;
  document.getElementById('detailUrl').textContent = d.url;
  const statusBadge = document.getElementById('detailStatus');
  const statusCls = isPortfolio ? 'na' : (s ? s.status : 'na');
  statusBadge.className = 'badge ' + statusCls;
  statusBadge.textContent = '● ' + (isPortfolio ? 'site' : (s ? s.status : 'unknown'));

  // Detail stats row
  const uniqueVisitors = new Set(d.visits.items.map(v => v.visitorHash || v.visitor_hash || '').filter(Boolean)).size;
  const stats = [
    { lbl: 'Visits (all time)', val: (d.visits.total || 0).toLocaleString() + (d.visits.truncated ? '+' : '') },
    { lbl: 'Unique visitors (recent)', val: uniqueVisitors.toLocaleString() },
    { lbl: 'Chats', val: (d.chats.total || 0).toLocaleString() + (d.chats.truncated ? '+' : '') },
  ];
  if (!isPortfolio) {
    stats.push({ lbl: 'Searches', val: (d.searches.total || 0).toLocaleString() + (d.searches.truncated ? '+' : '') });
    if (s) {
      stats.push({ lbl: 'Errors 24h', val: s.errors_24h });
      stats.push({ lbl: 'Avg latency', val: s.avg_latency_ms != null ? s.avg_latency_ms + 'ms' : '—' });
    }
  }
  document.getElementById('detailStatsRow').innerHTML = stats.map(st =>
    `<div class="stat"><div class="lbl">${esc(st.lbl)}</div><div class="val">${esc(st.val)}</div></div>`
  ).join('');

  // Body
  let body = '';

  if (!isPortfolio && s) {
    body += `
      <div class="detail-section">
        <h3>Health timeline</h3>
        <div class="chart-block">
          <div class="chart-label"><span>14-day uptime</span><span class="note">one bar per calendar day</span></div>
          ${renderUptimeBar(s.probes_14d)}
        </div>
        <div class="chart-block" style="margin-top:14px">
          <div class="chart-label"><span>Errors · last 24h</span><span class="note">per hour</span></div>
          ${renderSparkline(s.errors_24h_hourly)}
        </div>
      </div>
    `;

    body += `
      <div class="detail-section">
        <h3>Recent errors (${s.recent_errors ? s.recent_errors.length : 0}) <input class="filter-input" id="__errFilter" placeholder="filter…"></h3>
        <div class="scroll-list" id="__errList">${renderErrorList(s.recent_errors || [], '')}</div>
      </div>
    `;
  }

  if (d.visits.items.length) {
    body += `
      <div class="detail-section">
        <h3>Recent visits (${d.visits.items.length}) <input class="filter-input" id="__visitFilter" placeholder="filter…"></h3>
        <div class="scroll-list" id="__visitList">${renderVisitTable(d.visits.items, '')}</div>
      </div>
    `;
  } else {
    body += `<div class="detail-section"><h3>Recent visits</h3><div class="empty-note">No visits recorded yet.</div></div>`;
  }

  if (d.chats.items.length) {
    body += `
      <div class="detail-section">
        <h3>Recent chat questions (${d.chats.items.length}) <input class="filter-input" id="__chatFilter" placeholder="filter…"></h3>
        <div class="scroll-list" id="__chatList">${renderChatTable(d.chats.items, '')}</div>
      </div>
    `;
  } else {
    body += `<div class="detail-section"><h3>Recent chat questions</h3><div class="empty-note">No chat questions yet.</div></div>`;
  }

  if (d.searches.items.length) {
    body += `
      <div class="detail-section">
        <h3>Recent searches (${d.searches.items.length}) <input class="filter-input" id="__searchFilter" placeholder="filter…"></h3>
        <div class="scroll-list" id="__searchList">${renderSearchTable(d.searches.items, '')}</div>
      </div>
    `;
  }

  document.getElementById('detailBody').innerHTML = body;

  // Wire filters
  const wire = (inputId, listId, items, renderFn) => {
    const inp = document.getElementById(inputId);
    const list = document.getElementById(listId);
    if (!inp || !list) return;
    inp.addEventListener('input', () => {
      list.innerHTML = renderFn(items, inp.value.trim().toLowerCase());
    });
  };
  if (!isPortfolio && s) wire('__errFilter', '__errList', s.recent_errors || [], renderErrorList);
  wire('__visitFilter', '__visitList', d.visits.items, renderVisitTable);
  wire('__chatFilter', '__chatList', d.chats.items, renderChatTable);
  wire('__searchFilter', '__searchList', d.searches.items, renderSearchTable);
}

function renderErrorList(errors, q) {
  const filtered = q ? errors.filter(e => JSON.stringify(e).toLowerCase().includes(q)) : errors;
  if (!filtered.length) return `<div class="empty-note">${q ? 'No matches.' : 'No errors in last 24h ✓'}</div>`;
  return filtered.map(e => `
    <div class="err-item">
      <span class="src">${esc(e.source || '(unknown)')}</span>
      <span class="ts">${fmtTimeFull(e.timestamp)}</span>
      <div class="msg"><b>${esc(e.type || '')}</b>${e.type ? ' — ' : ''}${esc(e.message || '')}</div>
    </div>
  `).join('');
}

function renderVisitTable(items, q) {
  const filtered = q ? items.filter(v => JSON.stringify(v).toLowerCase().includes(q)) : items;
  if (!filtered.length) return `<div class="empty-note">${q ? 'No matches.' : 'No visits.'}</div>`;
  return `<table class="data"><thead><tr><th>When</th><th>Page</th><th>Location</th><th>Referrer</th><th>Device</th></tr></thead><tbody>${filtered.map(v => `
    <tr>
      <td class="muted">${fmtTimeFull(v.timestamp)}</td>
      <td>${esc(v.path || v.detail || '—')}</td>
      <td class="muted">${esc(fmtLocation(v))}</td>
      <td class="muted">${v.referrer ? (() => { try { return esc(new URL(v.referrer).hostname); } catch { return esc(v.referrer); } })() : 'Direct'}</td>
      <td class="muted">${esc(fmtDevice(v.userAgent))}</td>
    </tr>`).join('')}</tbody></table>`;
}

function renderChatTable(items, q) {
  const filtered = q ? items.filter(c => JSON.stringify(c).toLowerCase().includes(q)) : items;
  if (!filtered.length) return `<div class="empty-note">${q ? 'No matches.' : 'No chats.'}</div>`;
  return `<table class="data"><thead><tr><th>When</th><th>Location</th><th>Question</th><th>Answer</th></tr></thead><tbody>${filtered.map(c => `
    <tr>
      <td class="muted">${fmtTimeFull(c.timestamp)}</td>
      <td class="muted">${esc(fmtLocation(c))}</td>
      <td class="q">${esc(c.question || '')}</td>
      <td class="a">${esc((c.reply || '').slice(0, 300))}</td>
    </tr>`).join('')}</tbody></table>`;
}

function renderSearchTable(items, q) {
  const filtered = q ? items.filter(s => JSON.stringify(s).toLowerCase().includes(q)) : items;
  if (!filtered.length) return `<div class="empty-note">${q ? 'No matches.' : 'No searches.'}</div>`;
  return `<table class="data"><thead><tr><th>When</th><th>Search / detail</th></tr></thead><tbody>${filtered.map(s => `
    <tr>
      <td class="muted">${fmtTimeFull(s.timestamp)}</td>
      <td class="wrap">${esc(s.detail || '')}</td>
    </tr>`).join('')}</tbody></table>`;
}

// --- Actions ---
async function pingApp(url) {
  try { await fetch(url, { mode: 'no-cors', cache: 'no-store' }); return true; }
  catch { return false; }
}

async function wakeAll() {
  const btn = document.getElementById('wakeAllBtn');
  btn.disabled = true; btn.textContent = '⚡ Waking…';
  actionStatus.style.display = 'block';
  actionStatus.textContent = 'Pinging all apps…';
  if (!lastStatus) { btn.disabled = false; btn.textContent = '⚡ Wake all'; return; }
  const urls = Object.values(lastStatus.apps || {}).map(a => a.url);
  await Promise.all(urls.map(pingApp));
  actionStatus.textContent = 'Pinged ' + urls.length + ' apps at ' + new Date().toLocaleTimeString() + '. Give Streamlit ~30s to boot any that were asleep.';
  btn.textContent = '⚡ Wake all'; btn.disabled = false;
}

async function wipeVisits() {
  const pw = sessionStorage.getItem('studioPw');
  if (!pw) return;
  if (!confirm('Permanently delete ALL visit history across the portfolio and every app? Chat questions are kept. This cannot be undone.')) return;

  const btn = document.getElementById('wipeBtn');
  btn.disabled = true;
  actionStatus.style.display = 'block';
  let totalDeleted = 0;
  let batches = 0;
  try {
    while (true) {
      batches++;
      actionStatus.textContent = `Wiping… deleted ${totalDeleted} so far (batch ${batches})`;
      const res = await fetch('/api/admin/wipe-visits', { method: 'POST', headers: { 'X-Admin-Password': pw } });
      const j = await res.json().catch(() => ({ error: 'non-JSON response' }));
      if (!res.ok) {
        actionStatus.textContent = 'Error ' + res.status + ': ' + (j.error || 'unknown') + ' — deleted ' + totalDeleted + ' before stopping.';
        btn.disabled = false; return;
      }
      totalDeleted += j.deleted || 0;
      if (j.done) break;
      if (!j.deleted) break;
    }
    actionStatus.textContent = `Done — deleted ${totalDeleted} visit entries. Refreshing…`;
    await loadAll(pw);
    actionStatus.textContent = `Done — deleted ${totalDeleted} visit entries.`;
  } catch {
    actionStatus.textContent = 'Network error — stopped. Try again.';
  }
  btn.disabled = false;
}

function setupAutoRefresh() {
  const cb = document.getElementById('autoRefresh');
  if (localStorage.getItem('studioAutoRefresh') === '1') cb.checked = true;
  const apply = () => {
    if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
    if (cb.checked) {
      autoRefreshTimer = setInterval(() => {
        const pw = sessionStorage.getItem('studioPw');
        if (pw) loadAll(pw);
      }, 60000);
      localStorage.setItem('studioAutoRefresh', '1');
    } else {
      localStorage.removeItem('studioAutoRefresh');
    }
  };
  cb.addEventListener('change', apply);
  apply();
}

document.getElementById('loginBtn').addEventListener('click', () => loadAll(pwInput.value));
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') loadAll(pwInput.value); });
document.getElementById('refreshBtn').addEventListener('click', () => { const pw = sessionStorage.getItem('studioPw'); if (pw) loadAll(pw); });
document.getElementById('wakeAllBtn').addEventListener('click', wakeAll);
document.getElementById('wipeBtn').addEventListener('click', wipeVisits);
document.getElementById('backBtn').addEventListener('click', () => { overviewScreen.style.display = 'block'; detailScreen.style.display = 'none'; });
setupAutoRefresh();

const saved = sessionStorage.getItem('studioPw');
if (saved) loadAll(saved);
</script>
